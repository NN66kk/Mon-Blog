site_name: Mon's Digital Garden
site_description: Mon 的学习笔记、生活记录与行旅札记。
site_author: Mon
site_url: https://nn66kk.github.io/Mon-Blog/
site_dir: !ENV [MON_BLOG_SITE_DIR, site]

repo_url: https://github.com/NN66kk/Mon-Blog
repo_name: NN66kk/Mon-Blog
edit_uri: edit/main/docs/

extra:
  about_page: "about.md"
  legacy_about_page: "D-Orginals/2024070515116.md"
  about_url: "about/"
  collection_order:
    - D
    - B
    - A
    - C
  collections:
    A:
      mark: 行
      label: 行旅札记
      description: 训练、饮食、出行与日常生活里反复验证的小经验。
      index: "A-Life/000000生活专栏目录/"
      index_src: "A-Life/000000生活专栏目录.md"
      source_dir: "A-Life"
      legacy_tag: "生活专栏"
    B:
      mark: 技
      label: 格物札记
      description: 技术、数学、英语与 AI 学习过程中留下的方法和推演。
      index: "B-Notes/000000学习笔记目录/"
      index_src: "B-Notes/000000学习笔记目录.md"
      source_dir: "B-Notes"
      legacy_tag: "学习笔记"
    C:
      mark: 拾
      label: 人间拾遗
      description: 值得保存的网站、文章、故事与那些让人会心一笑的片段。
      index: "C-Highlights/000000优质内容目录/"
      index_src: "C-Highlights/000000优质内容目录.md"
      source_dir: "C-Highlights"
      legacy_tag: "优质内容"
    D:
      mark: 思
      label: 原创手记
      description: 对工具、旅行、成长与现实问题的亲历、判断和复盘。
      index: "D-Orginals/000000原创文章目录/"
      index_src: "D-Orginals/000000原创文章目录.md"
      source_dir: "D-Orginals"
      legacy_tag: "原创文章"

theme:
  name: material
  custom_dir: docs/templates
  language: zh
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.path
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: "切换到「夜瓷星图」"
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: "切换到「月光流釉」"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  # Preserve intentional single line breaks in lyrics and other prose.
  - nl2br
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  superpowers
  B-Notes/003英语/总结.md
  D-Orginals/苹果电脑自动化脚本教程_2025070215169.md

plugins:
  - search
  - meta
  - roamlinks

hooks:
  - hooks/post_metadata.py

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/share-link.js
  - javascripts/article-toc.js
  - javascripts/archive-filter.js
  - javascripts/site-ui.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js

extra_css:
  - css/00-tokens.css
  - css/10-shell.css
  - css/20-components.css
  - css/30-article.css
  - css/40-home.css
  - css/50-archive.css
  - css/60-collection.css
