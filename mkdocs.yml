INHERIT: shared/blog.json
site_dir: !ENV [MON_BLOG_SITE_DIR, site]

theme:
  name: material
  custom_dir: docs/templates
  language: zh
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.path
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: "切换到「夜瓷星图」"
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: "切换到「月光流釉」"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  # Preserve intentional single line breaks in lyrics and other prose.
  - nl2br
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: garden-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - meta
  - roamlinks

hooks:
  - hooks/post_metadata.py
  - hooks/dataview_static.py
  - hooks/mermaid_assets.py

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/share-link.js
  - javascripts/article-toc.js
  - javascripts/archive-filter.js
  - javascripts/site-ui.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - path: javascripts/mermaid.js
    type: module

extra_css:
  - css/00-tokens.css
  - css/10-shell.css
  - css/20-components.css
  - css/30-article.css
  - css/40-home.css
  - css/50-archive.css
  - css/60-collection.css
  - css/70-discovery.css
