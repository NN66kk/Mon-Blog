[build]
command = "python -m pip install -r requirements.txt && python -m unittest discover -s tests -p 'test_*.py' -v && node --test tests/*.test.js && mkdocs build --strict && python scripts/check_site.py --site-dir site"
publish = "site"

[build.environment]
PYTHON_VERSION = "3.12"
NODE_VERSION = "24"
